version: 2

models:
  - name: fct_daily_channel_metrics
    description: "Fact table for daily channel metrics."
    columns:
      - name: channel_sk
        tests:
          - not_null
      - name: date_id
        tests:
          - not_null
      - name: daily_views
        description: "Calculated views from the previous day"
      - name: total_views
        description: "Cumulative total views"
