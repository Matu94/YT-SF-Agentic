name: Export Streamlit Data to S3

on:
  schedule:
    # Runs daily at 03:22 Budapest time (01:22 UTC in CEST / Summer time) - 22 because queues, if not works i migrate to airflow.
    - cron: "22 1 * * *"
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment (leave empty to infer from branch)"
        required: false
        default: ""
        type: choice
        options:
          - ""
          - dev
          - prod

jobs:
  build:
    name: Resolve environment
    runs-on: ubuntu-latest
    outputs:
      env_name: ${{ steps.env.outputs.env_name }}
      should_run: ${{ steps.env.outputs.should_run }}
    steps:
      - name: Set environment from trigger
        id: env
        run: |
          ref="${{ github.ref }}"
          event="${{ github.event_name }}"
          input_env="${{ github.event.inputs.environment }}"

          echo "Triggered by event: $event on ref: $ref"

          if [[ "$event" == "schedule" ]]; then
            if [[ "$ref" == refs/heads/prod ]]; then
              echo "Scheduled trigger on prod branch -> targeting PROD database."
              echo "env_name=prod" >> "$GITHUB_OUTPUT"
              echo "should_run=true" >> "$GITHUB_OUTPUT"
            else
              echo "Scheduled trigger received on non-prod ref ($ref). Scheduled runs are restricted to prod. Skipping."
              echo "env_name=prod" >> "$GITHUB_OUTPUT"
              echo "should_run=false" >> "$GITHUB_OUTPUT"
            fi
          elif [[ -n "$input_env" ]]; then
            echo "Manual execution with explicit environment override: $input_env"
            echo "env_name=$input_env" >> "$GITHUB_OUTPUT"
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          elif [[ "$ref" == refs/heads/prod ]]; then
            echo "Manual execution from prod branch -> targeting PROD database."
            echo "env_name=prod" >> "$GITHUB_OUTPUT"
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "Manual execution from $ref -> targeting DEV database."
            echo "env_name=dev" >> "$GITHUB_OUTPUT"
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          fi

  export:
    needs: build
    if: needs.build.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    environment: ${{ needs.build.outputs.env_name }}
    env:
      SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
      SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
      SNOWFLAKE_ROLE: ${{ secrets.SNOWFLAKE_ROLE }}
      SNOWFLAKE_DATABASE: ${{ vars.SNOWFLAKE_DATABASE }}
      SNOWFLAKE_WAREHOUSE: ${{ vars.SNOWFLAKE_WAREHOUSE }}
      SNOWFLAKE_PRIVATE_KEY: ${{ secrets.SNOWFLAKE_PRIVATE_KEY }}
      PRIVATE_KEY_PASSPHRASE: ${{ secrets.SNOWFLAKE_PRIVATE_KEY_PASS }}
      S3_BUCKET_NAME: ${{ vars.S3_BUCKET_NAME || 'yt-sf-metrics-data-prod' }}
      AWS_DEFAULT_REGION: ${{ vars.AWS_DEFAULT_REGION || 'eu-north-1' }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'schedule' && 'prod' || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: pip install "snowflake-connector-python[pandas]" pyarrow s3fs pandas

      - name: Write private key file
        run: |
          mkdir -p ~/.snowflake
          printf '%s\n' "$SNOWFLAKE_PRIVATE_KEY" > ~/.snowflake/rsa_key.p8
          chmod 600 ~/.snowflake/rsa_key.p8

      - name: Export Data to S3
        run: python3 .deployment/export_to_s3.py
